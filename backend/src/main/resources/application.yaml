spring:
  application:
    name: agenda-ambulatorio
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agenda}
    username: ${DB_USERNAME:agenda}
    password: ${DB_PASSWORD:agenda-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Liquibase runs every changeset when no context is given, demo data included.
    # Naming one keeps the demo data out unless LIQUIBASE_CONTEXTS=demo asks for it.
    contexts: ${LIQUIBASE_CONTEXTS:production}
  mvc:
    format:
      date: iso
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        # The outbox retries by itself every second, so a send gives up quickly.
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # A consumer group that starts for the first time reads the events already on the topic.
      auto-offset-reset: earliest

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # The demo runs on plain http://localhost. Behind HTTPS set SESSION_COOKIE_SECURE=true.
        secure: ${SESSION_COOKIE_SECURE:false}

springdoc:
  # Errors are documented where they can actually happen, not on every operation.
  override-with-generic-response: false
  # Stable output, so the committed copy of the spec only changes when the API does.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  swagger-ui:
    # Lets "Try it out" send the CSRF token, like the application does.
    csrf:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
