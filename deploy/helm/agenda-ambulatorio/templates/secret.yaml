{{- if not .Values.postgresql.existingSecret }}
{{- $name := include "agenda.dbSecretName" . }}
{{- $password := .Values.postgresql.password }}
{{- if not $password }}
{{- if not .Values.postgresql.enabled }}
{{- fail "postgresql.password or postgresql.existingSecret is needed for an external database" }}
{{- end }}
{{- /* Generated once: an upgrade finds the secret and keeps the password the database has. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agenda.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
  annotations:
    # Kept on uninstall, like the database volume: a new install then finds the same password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
